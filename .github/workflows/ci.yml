name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - name: Contract is up to date
        run: uv run evs openapi --out /tmp/openapi.json && diff -q /tmp/openapi.json ../../packages/contract/openapi.json

  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest "ruff==0.16.10"
      - run: cd tools/apex-inventory && ruff check . && ruff format --check . && python -m pytest -q
      - name: Inventory artifacts are up to date
        run: make inventory && git diff --exit-code -- legacy

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api
      - run: pnpm lint && pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: apps/web/dist }

  a11y:
    # WP6a extends this job: axe on every route x viewport x theme, pa11y-ci, Lighthouse, OpenACR generation.
    runs-on: ubuntu-latest
    needs: [web]
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: axe-results, path: apps/web/a11y-results }
