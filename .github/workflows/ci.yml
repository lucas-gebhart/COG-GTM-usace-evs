name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - name: Contract is up to date
        run: uv run evs openapi --out /tmp/openapi.json && diff -q /tmp/openapi.json ../../packages/contract/openapi.json

  api-db:
    # SQL mode: migrations + seed + the full pytest suite (tests/test_db.py must not skip here).
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env: { POSTGRES_USER: evs, POSTGRES_PASSWORD: evs, POSTGRES_DB: evs }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evs -d evs" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      EVS_DATABASE_URL: postgresql+asyncpg://evs:evs@localhost:5432/evs
      EVS_DATABASE_URL_SYNC: postgresql://evs:evs@localhost:5432/evs
      EVS_TEST_DATABASE_URL: postgresql://evs:evs@localhost:5432/evs
      EVS_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run evs migrate
      - run: uv run evs seed
      - run: uv run pytest -q
      - name: CSV export in SQL mode
        run: |
          EVS_DATA_MODE=db uv run uvicorn evs.main:app --port 8000 & sleep 3
          curl -fsS "localhost:8000/api/v1/projects?district=LRL&sort=-funded_amount&format=csv" | head -5
          curl -fsS -o /dev/null -w "%{http_code}\n" "localhost:8000/api/v1/enterprise/kpis"

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api
      - run: pnpm lint && pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: apps/web/dist }

  a11y:
    # WP6a extends this job: axe on every route x viewport x theme, pa11y-ci, Lighthouse, OpenACR generation.
    runs-on: ubuntu-latest
    needs: [web]
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: axe-results, path: apps/web/a11y-results }
