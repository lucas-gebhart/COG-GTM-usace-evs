# ora2pg configuration for the Strategic Planner (APEX 24.2 starter app) SP_ schema.
# File-input mode: no Oracle connection is used. The DSN below is a placeholder that
# ora2pg requires syntactically; run.sh passes each Oracle DDL file with -i / INPUT_FILE.
ORACLE_DSN	dbi:Oracle:host=localhost;sid=NONE
ORACLE_USER	none
ORACLE_PWD	none

# Oracle side
SCHEMA		SP
EXPORT_SCHEMA	1
# PostgreSQL side: everything lands in schema "legacy" (db/migrations/0002_legacy_sp_schema.sql)
PG_SCHEMA	legacy
PG_VERSION	17
PG_SUPPORTS_IDENTITY	1
PG_SUPPORTS_PROCEDURE	1
PG_SUPPORTS_LATERAL	1
PG_SUPPORTS_SUBSTR	1
PG_INTEGER_TYPE	1
PG_NUMERIC_TYPE	1
DEFAULT_NUMERIC	numeric
DATA_TYPE	DATE:timestamp(0),LONG:text,LONG RAW:bytea,CLOB:text,NCLOB:text,BLOB:bytea,BFILE:bytea,RAW(16):uuid,RAW(32):uuid,RAW:bytea,UROWID:oid,ROWID:oid,FLOAT:double precision,DEC:decimal,DECIMAL:decimal,DOUBLE PRECISION:double precision,INT:numeric,INTEGER:numeric,REAL:real,SMALLINT:smallint,BINARY_FLOAT:double precision,BINARY_DOUBLE:double precision,TIMESTAMP:timestamp,XMLTYPE:xml,BINARY_INTEGER:integer,PLS_INTEGER:integer,TIMESTAMP WITH TIME ZONE:timestamp with time zone,TIMESTAMP WITH LOCAL TIME ZONE:timestamp with time zone
VARCHAR_TO_TEXT	0
# Keep Oracle object names as written (lower-cased by ora2pg), no quoting
PRESERVE_CASE	0
USE_RESERVED_WORDS	1
# PL/SQL to PL/pgSQL conversion and the assessment
PLSQL_PGSQL	1
ESTIMATE_COST	1
COST_UNIT_VALUE	5
AUTODETECT_SPATIAL_TYPE	1
FUNCTION_CHECK	0
# Output
OUTPUT_DIR	output
FILE_PER_TABLE	0
FILE_PER_FUNCTION	0
DISABLE_SEQUENCE	0
STOP_ON_ERROR	1
