# EVS manual accessibility attestation. Hand-edited by testers; read by evs-acr-gen (tools/acr).
# One entry per WCAG 2.1 A/AA criterion that needs manual evidence, plus Revised 508 FPC (302.x) and
# support documentation (602/603) rows. Test IDs (MT-*) are defined in docs/a11y/MANUAL_TEST_PLAN.md.
# status: supports | partially-supports | does-not-support | not-applicable | not-evaluated
# A row is 'supports' only after the listed tests pass on the stated build with the stated assistive
# technology. Leave not-evaluated (tester, date, assistive_tech empty) until that happens; the generator
# then reports the criterion as not-evaluated no matter what the automated cells say.
schema_version: 1
product_version: 0.1.0-demo
testers: []
# Assistive technology ids used in attestations (fill versions when testing starts).
assistive_technology:
  - id: nvda-firefox
    name: "NVDA + Firefox (Windows 11)"
    version: ''
  - id: jaws-chrome
    name: "JAWS + Chrome (Windows 11)"
    version: ''
  - id: voiceover-ios
    name: "VoiceOver + Safari (iOS)"
    version: ''
  - id: keyboard-only
    name: "Keyboard only (no pointer)"
    version: ''
  - id: zoom-400
    name: "Browser zoom 400% / 320 CSS px"
    version: ''
  - id: forced-colors
    name: "Windows High Contrast (forced-colors: active)"
    version: ''
  - id: cvd-sim
    name: "Colour-vision deficiency simulation (deuteranopia, protanopia, tritanopia)"
    version: ''
  - id: reduced-motion
    name: "prefers-reduced-motion: reduce"
    version: ''
