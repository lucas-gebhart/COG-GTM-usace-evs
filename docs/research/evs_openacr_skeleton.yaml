notes: >-
  SKELETON. Generated by evs-acr-gen from (1) the OpenACR catalog 2.5-edition-wcag-2.1-508-en.yaml, (2)
  axe-core results collected by @axe-core/playwright across every EVS route and viewport, and (3) a signed
  manual attestation file (manual-attestation.yaml). Every "not-evaluated" level is a placeholder to be
  replaced at generation time. Only the Web component is evaluated; Electronic Documents, Software (Chapter
  5, 502/503) and Authoring Tools are reported Not Applicable because EVS is a web application evaluated
  against WCAG (VPAT 2.5 guidance for web content). Target: WCAG 2.1 Level AA plus Revised Section 508
  (which incorporates WCAG 2.0 A/AA). WCAG 2.2 criteria 2.4.11, 2.5.7 and 2.5.8 are tracked as design
  targets outside this report.
evaluation_methods_used: >-
  Automated: axe-core 4.x via @axe-core/playwright (CI, every route, 1280px and 360px, light and dark
  themes), eslint-plugin-jsx-a11y, Storybook a11y addon, Lighthouse accessibility category. Manual: keyboard-only
  pass, NVDA + Firefox, JAWS + Chrome, VoiceOver + Safari (macOS and iOS), 200% and 400% zoom / 320 CSS
  px reflow, Windows High Contrast (forced-colors), colour-vision deficiency simulation (Chrome DevTools),
  prefers-reduced-motion. Manual test IDs (MT-*) refer to the EVS manual test plan.
legal_disclaimer: >-
  This skeleton is not a conformance claim. The generated ACR reflects testing of the EVS demo at the
  stated version and date and is provided in good faith; it does not represent a legally binding guarantee.
