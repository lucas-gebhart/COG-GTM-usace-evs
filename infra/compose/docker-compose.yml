# Local parity stack for the GovCloud reference architecture (service mapping in README.md).
#   web  -> ECS Fargate web (nginx + React)        keycloak -> Cognito / Army ICAM
#   api  -> ECS Fargate api (FastAPI)              db       -> Aurora PostgreSQL + PostGIS
#   ingest -> ECS Fargate scheduled task           minio    -> S3
# `make demo` runs `docker compose up --build -d --wait`, which blocks until every healthcheck passes.
name: evs
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: evs
      POSTGRES_PASSWORD: evs
      POSTGRES_DB: evs
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evs -d evs"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: "true"
    ports: ["8080:8080"]
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]
    healthcheck:
      # The image has no curl or wget; bash /dev/tcp against the management port (9000) health endpoint.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  minio:
    # minio/minio is no longer published on Docker Hub or quay (pulls fail with "repository does not exist"),
    # so the Bitnami build of the same server is used; same S3 API and console ports.
    image: bitnamilegacy/minio:2025.5.24
    environment:
      MINIO_ROOT_USER: evs
      MINIO_ROOT_PASSWORD: evs-local-minio
      MINIO_DEFAULT_BUCKETS: evs-raw
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/bitnami/minio/data"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    environment:
      EVS_ENV: local
      EVS_DATABASE_URL: postgresql+asyncpg://evs:evs@db:5432/evs
      EVS_DATABASE_URL_SYNC: postgresql://evs:evs@db:5432/evs
      EVS_OIDC_ISSUER: http://localhost:8080/realms/evs
      EVS_AUTH_DISABLED: "true"
      EVS_FEED_SOURCE: ${EVS_FEED_SOURCE:-fixtures}
      EVS_S3_ENDPOINT: http://minio:9000
      EVS_CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    command: >
      sh -c "evs migrate && evs seed && uvicorn evs.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      keycloak: { condition: service_started }
      minio: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Public-feed worker: LPMS every 15 min, NOAA/USGS every 30 min, NDC GIS daily. EVS_FEED_SOURCE=live polls the
  # real endpoints, fixtures replays legacy/data_samples, simulated runs the labelled Markov simulator.
  ingest:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    environment:
      EVS_DATABASE_URL_SYNC: postgresql://evs:evs@db:5432/evs
      EVS_FEED_SOURCE: ${EVS_FEED_SOURCE:-fixtures}
      EVS_S3_ENDPOINT: http://minio:9000
      EVS_S3_ACCESS_KEY: evs
      EVS_S3_SECRET_KEY: evs-local-minio
      EVS_SAMPLES_DIR: /legacy/data_samples
    command: >
      sh -c "evs migrate && evs ingest --once && evs ingest --loop"
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_healthy }

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        FETCH_BASEMAP: ${FETCH_BASEMAP:-true}
    environment:
      API_UPSTREAM: http://api:8000
      DNS_RESOLVER: 127.0.0.11
    ports: ["3000:80"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata: {}
  minio: {}
