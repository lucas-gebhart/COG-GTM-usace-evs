# EVS API and ingestion worker on Fly.io. One image (apps/api/Dockerfile), two process groups:
#   api    uvicorn, public over https://usace-evs-api.fly.dev and private as usace-evs-api.internal:8000
#   ingest `evs ingest --loop`, no public ports; retries every 5 minutes if the worker exits
# Deploy from the repo root so the build context matches Compose:
#   fly deploy --config infra/fly/api/fly.toml --dockerfile apps/api/Dockerfile .
app = "usace-evs-api"
primary_region = "iad"

[build]
  dockerfile = "../../../apps/api/Dockerfile"  # relative to this file; build context is the repo root

[deploy]
  # Same SQL files as Compose and Aurora. `evs seed` lands with WP2; until then the fallback keeps releases green.
  release_command = "sh -c 'evs migrate && (evs seed || echo \"evs seed unavailable (WP2); continuing\")'"
  strategy = "rolling"

[env]
  EVS_ENV = "fly"
  EVS_FEED_SOURCE = "live"
  EVS_AUTH_DISABLED = "true"
  EVS_OIDC_ISSUER = "https://usace-evs-keycloak.fly.dev/realms/evs"
  EVS_OIDC_AUDIENCE = "evs-web"
  EVS_CORS_ORIGINS = '["https://usace-evs-web.fly.dev"]'
  EVS_PMTILES_URL = "/tiles/usace.pmtiles"
# EVS_DATABASE_URL and EVS_DATABASE_URL_SYNC are Fly secrets set by deploy.sh (never committed).

[processes]
  # uvicorn binds one address and asyncio makes "::" IPv6-only, so open a dual-stack socket first:
  # Fly health checks and fly-proxy arrive over IPv4, nginx in usace-evs-web arrives over the IPv6 6PN.
  api = "python -c \"import os,socket; s=socket.socket(socket.AF_INET6); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_V6ONLY, 0); s.bind(('::', 8000)); s.listen(2048); os.set_inheritable(s.fileno(), True); os.execvp('uvicorn', ['uvicorn', 'evs.main:app', '--fd', str(s.fileno())])\""
  # WP0 ships `evs ingest --once` as a stub and WP5a owns the real cycle and `--loop`. Prefer --loop, fall back to
  # a 15-minute --once loop, and keep the machine alive either way so the process group survives the handover.
  ingest = "sh -c 'while true; do evs ingest --loop || evs ingest --once || echo \"ingest cycle unavailable yet (WP5a)\"; sleep 900; done'"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["api"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["api"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["ingest"]
