# PostGIS for the Fly.io demo. Same image as infra/compose (postgis/postgis:17-3.5), reached by the API
# over the private 6PN network as usace-evs-db.internal:5432. No public services are exposed.
app = "usace-evs-db"
primary_region = "iad"

[build]
  image = "postgis/postgis:17-3.5"

[env]
  POSTGRES_USER = "evs"
  POSTGRES_DB = "evs"
  # The Fly volume root contains lost+found, so initdb needs a subdirectory.
  PGDATA = "/var/lib/postgresql/data/pgdata"
# POSTGRES_PASSWORD is a Fly secret set by deploy.sh (never committed).

[mounts]
  source = "pgdata"
  destination = "/var/lib/postgresql/data"
  initial_size = "10gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[[restart]]
  policy = "always"

[checks]
  [checks.pg]
    type = "tcp"
    port = 5432
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
