# Keycloak for the Fly.io demo. Dev mode with the file-backed H2 database on a small volume;
# the realm (roles, evs-web client, demo users) is imported from the image on first start.
app = "usace-evs-keycloak"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"  # relative to this file; build context is the repo root

[env]
  KC_BOOTSTRAP_ADMIN_USERNAME = "admin"
  KC_HOSTNAME = "https://usace-evs-keycloak.fly.dev"
  KC_HTTP_PORT = "8080"
  KC_PROXY_HEADERS = "xforwarded"
  KC_HEALTH_ENABLED = "true"
# KC_BOOTSTRAP_ADMIN_PASSWORD is a Fly secret set by deploy.sh (never committed).

[mounts]
  source = "kcdata"
  destination = "/opt/keycloak/data/h2"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/realms/evs"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
